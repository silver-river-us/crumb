name: Quality

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-checks:
    name: Static checks
    runs-on: ubuntu-latest
    env:
      CXX: clang++
      CXXFLAGS: -stdlib=libc++
      LDFLAGS: -stdlib=libc++
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain and analyzers
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang clang-tidy clang-format cppcheck iwyu cmake ninja-build zlib1g-dev libc++-dev libc++abi-dev

      - name: Configure
        run: cmake --preset default -G Ninja -D CMAKE_CXX_COMPILER=clang++ -D CMAKE_CXX_FLAGS=-stdlib=libc++ -D CMAKE_EXE_LINKER_FLAGS=-stdlib=libc++ -D CRUMB_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build --preset default

      - name: Run static checks
        run: |
          cmake --build build --target lint
          cmake --build build --target format-check
          cmake --build build --target cppcheck
          cmake --build build --target iwyu

      - name: Run tests
        run: ctest --preset default

  static-memory-analysis:
    name: Static memory ownership analysis
    runs-on: ubuntu-latest
    env:
      CXX: clang++
      CXXFLAGS: -stdlib=libc++
      LDFLAGS: -stdlib=libc++
    steps:
      - uses: actions/checkout@v4

      - name: Install Clang Static Analyzer
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang clang-tools perl cmake ninja-build zlib1g-dev libc++-dev libc++abi-dev

      - name: Configure
        # Configure through scan-build so CMake records its analyzer compiler
        # wrapper; wrapping only an already-configured CMake build can miss it.
        run: >-
          scan-build --status-bugs
          -enable-checker cplusplus.NewDeleteLeaks
          -enable-checker unix.Malloc
          -enable-checker unix.MismatchedDeallocator
          --use-cc clang --use-c++ clang++
          cmake --preset default -G Ninja
          -D CMAKE_CXX_FLAGS=-stdlib=libc++
          -D CMAKE_EXE_LINKER_FLAGS=-stdlib=libc++

      - name: Analyze memory ownership and leak paths
        run: >-
          scan-build --status-bugs
          -enable-checker cplusplus.NewDeleteLeaks
          -enable-checker unix.Malloc
          -enable-checker unix.MismatchedDeallocator
          --use-cc clang --use-c++ clang++
          cmake --build --preset default

  address-and-undefined-sanitizers:
    name: Memory safety (ASan + UBSan)
    runs-on: ubuntu-latest
    env:
      CXX: clang++
      CXXFLAGS: -stdlib=libc++
      LDFLAGS: -stdlib=libc++
    steps:
      - uses: actions/checkout@v4

      - name: Install compiler and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang cmake ninja-build zlib1g-dev libc++-dev libc++abi-dev libclang-rt-dev

      - name: Configure
        run: cmake --preset asan-ubsan -G Ninja -D CMAKE_CXX_COMPILER=clang++ -D CMAKE_CXX_FLAGS=-stdlib=libc++ -D CMAKE_EXE_LINKER_FLAGS=-stdlib=libc++

      - name: Build
        run: cmake --build --preset asan-ubsan

      - name: Run AddressSanitizer and UndefinedBehaviorSanitizer tests
        # Ubuntu's shared libc++abi has an alloc/dealloc mismatch in exception
        # cleanup that is unrelated to the instrumented application code.
        env:
          ASAN_OPTIONS: alloc_dealloc_mismatch=0
        run: ctest --preset asan-ubsan

  coverage:
    name: Coverage report
    runs-on: ubuntu-latest
    env:
      CXX: clang++
      CXXFLAGS: -stdlib=libc++
      LDFLAGS: -stdlib=libc++
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM compiler, coverage tools, and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang llvm cmake ninja-build zlib1g-dev libc++-dev libc++abi-dev libclang-rt-dev

      - name: Configure coverage build
        run: cmake --preset coverage -G Ninja -D CMAKE_CXX_COMPILER=clang++ -D CMAKE_CXX_FLAGS=-stdlib=libc++ -D CMAKE_EXE_LINKER_FLAGS=-stdlib=libc++

      - name: Build coverage binaries
        run: cmake --build --preset coverage

      - name: Run coverage report
        run: bin/coverage

  thread-sanitizer:
    name: Thread safety (TSan)
    runs-on: ubuntu-latest
    env:
      CXX: clang++
      CXXFLAGS: -stdlib=libc++
      LDFLAGS: -stdlib=libc++
    steps:
      - uses: actions/checkout@v4

      - name: Install compiler and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang cmake ninja-build zlib1g-dev libc++-dev libc++abi-dev libclang-rt-dev

      - name: Configure
        run: cmake --preset tsan -G Ninja -D CMAKE_CXX_COMPILER=clang++ -D CMAKE_CXX_FLAGS=-stdlib=libc++ -D CMAKE_EXE_LINKER_FLAGS=-stdlib=libc++

      - name: Build
        run: cmake --build --preset tsan

      - name: Run ThreadSanitizer tests
        run: ctest --preset tsan
